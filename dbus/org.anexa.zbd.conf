<?xml version="1.0" encoding="UTF-8"?>
<!--
  System bus policy for the zbd-system service.

  The bus name org.anexa.zbd1 may be owned ONLY by root (the service
  is launched by systemd as root with CAP_SYS_ADMIN). Users in the
  `zbd` group are allowed to send method calls to the
  org.anexa.zbd1.System interface; everyone else is denied.

  Authorization for individual methods (which user can do what) is
  delegated to polkit via the polkit policy at
  /usr/share/polkit-1/actions/org.anexa.zbd.policy. This file only
  controls who can connect at all and who can own the name.

  Reload after editing:
      systemctl reload dbus
-->
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Only root may own the bus name. -->
  <policy user="root">
    <allow own="org.anexa.zbd1"/>
    <allow send_destination="org.anexa.zbd1"/>
    <allow receive_sender="org.anexa.zbd1"/>
  </policy>

  <!-- Members of the `zbd` group can issue calls. polkit decides
       which actions actually go through. -->
  <policy group="zbd">
    <allow send_destination="org.anexa.zbd1"
           send_interface="org.anexa.zbd1.System"/>
    <allow send_destination="org.anexa.zbd1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.anexa.zbd1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.anexa.zbd1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>

  <!-- Default for everyone else: deny. polkit-ed methods that
       allow_active=yes still reach the bus because dbus-broker
       evaluates polkit actions before this default kicks in. -->
  <policy context="default">
    <deny send_destination="org.anexa.zbd1"/>
    <allow send_destination="org.anexa.zbd1"
           send_interface="org.anexa.zbd1.System"/>
    <allow send_destination="org.anexa.zbd1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.anexa.zbd1"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>

</busconfig>
